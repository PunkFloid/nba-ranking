<!doctype html>
<html lang="cs">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#0b101b">
 <title>NBA Ranking</title>
 <link rel="stylesheet" href="/src/styles.css">
 <link rel="stylesheet" href="/src/features.css">
</head>
<body>
 <main>
  <header class="brand">
   <img src="%BASE_URL%app-icon-v1.png" alt="" width="46" height="46">
   <div class="brand-copy"><h1>NBA Ranking</h1></div>
   <button id="settings" class="header-action" type="button" aria-label="Nastavení" title="Nastavení" aria-pressed="false" hidden>Nastavení</button>
   <button id="logout" type="button" aria-label="Odhlásit" title="Odhlásit" hidden>Odhlásit</button>
  </header>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="err" role="alert"></p>
  <p id="feedback" class="sr-only" role="status" aria-live="polite"></p>
  <form id="login">
   <h2>Přihlášení</h2>
   <label for="email">E-mail</label>
   <input id="email" type="email" autocomplete="username" required>
   <label for="password">Heslo</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <button id="signin" type="submit">Přihlásit se</button>
  </form>
  <section id="content" aria-label="Obsah aplikace" hidden></section>
 </main>
 <nav id="nav" aria-label="Hlavní navigace" hidden>
  <button type="button" data-tab="vote">Porovnávání</button>
  <button type="button" data-tab="ranking">Žebříček</button>
  <button type="button" data-tab="history">Historie</button>
 </nav>
 <script type="module" src="/src/main.js"></script>
</body>
</html>
